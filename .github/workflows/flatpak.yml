# Builds the Flatpak (tools/flatpak) inside Flathub's own build container, so
# the manifest is proven the way Flathub will build it before it is submitted
# there. The bundle is uploaded for anyone to try: flatpak install deckboy.flatpak
name: Flatpak
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/flatpak/**'
      - '.github/workflows/flatpak.yml'
jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        # The checkout build, and the exact manifest submitted to Flathub,
        # which builds the tagged release from GitHub.
        manifest:
          - tools/flatpak/io.github.utopian_academy.Deckboy.yml
          - tools/flatpak/flathub/io.github.utopian_academy.Deckboy.yml
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: deckboy.flatpak
          manifest-path: ${{ matrix.manifest }}
          cache-key: flatpak-builder-${{ strategy.job-index }}-${{ github.sha }}
      # A package that builds is not a package that runs: install the bundle
      # and ask Deckboy about itself, from inside the sandbox.
      - name: The bundle installs and runs
        run: |
          flatpak install --user -y --noninteractive --bundle deckboy.flatpak
          flatpak run --command=deckboy io.github.utopian_academy.Deckboy --version
          xvfb-run -a flatpak run --command=deckboy io.github.utopian_academy.Deckboy --self-check | tee self-check.txt
          grep -q "ndi-sdk: headers detected" self-check.txt
      # Flathub's own linter, on the manifest and the metainfo.
      - name: Flathub lint
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest ${{ matrix.manifest }} || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream tools/flatpak/io.github.utopian_academy.Deckboy.metainfo.xml || true
