name: Deckboy CI

# Triggers used to name `deckboy-0.75`, a branch that no longer exists, so
# push/PR builds silently never ran and only tag builds did — which is how the
# workflow drifted a whole SDL major version behind without anyone noticing.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-check:
    name: Version Guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must use SemVer: MAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            expected="v$version"
            if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${expected}" >&2
              exit 1
            fi

            # The release notes come out of CHANGES.md, and that extraction ran
            # in the publish job -- LAST, after six platform builds. A missing
            # section is a thirty-second omission that cost a full matrix to
            # discover, twice. It is knowable now, so it is checked now.
            if ! grep -qE "^## .*v${version}([^0-9]|$)" CHANGES.md; then
              echo "No CHANGES.md section for v${version}." >&2
              echo "Add a '## <date> - v${version} (...)' heading; the publish" >&2
              echo "job takes the release notes from everything under it." >&2
              exit 1
            fi
          fi

  # The Companion module is plain Node with no native deps, so it is by far the
  # cheapest signal in the matrix — run it first.
  companion-module:
    # Named for what it actually runs. Ten source checks live in this job, so a
    # red cross on "Companion Module Tests" was most often an audit failing and
    # nothing to do with Companion at all.
    name: Source Checks + Companion Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @companion-module/base 2.x declares
          # engines.node ^22.20 || ^26.5, and node22 is also the oldest
          # runtime.type the module manifest schema still accepts.
          node-version: '22'
      - name: Install and test
        working-directory: companion-module-utopianacademy-deckboy
        run: |
          npm install --no-audit --no-fund
          npm test

      # docs/manual.html is GENERATED from MANUAL.md. Edit the manual, forget
      # the generator, and the site keeps serving the old text to everyone who
      # arrives from a search -- silently, because the page still loads.
      - name: The manual page matches the manual
        run: |
          python3 tools/build_manual_page.py
          if ! git diff --quiet -- docs/manual.html; then
            echo "docs/manual.html is out of date with MANUAL.md."
            echo "Run: python tools/build_manual_page.py  and commit the result."
            git --no-pager diff --stat -- docs/manual.html
            exit 1
          fi
          echo "manual page is current"

      # Six pages that link to each other and to anchors inside the manual.
      # A dead link on a landing page loses the visitor after the expensive
      # part -- getting them there -- has already been paid for.
      - name: The site has no dead links
        run: python3 tools/check_site_links.py

      # The Stream Deck plugin has no dependencies at all, so there is nothing
      # to install -- the build assembles the .sdPlugin folder and checks every
      # path the manifest names, which is the failure Stream Deck reports worst.
      - name: Stream Deck plugin
        working-directory: streamdeck-plugin-deckboy
        run: |
          node tools/build.js
          npm test
          node tools/pack.js

      # The module Companion actually installs, rather than the source tree.
      #
      # NOT BUILT YET. Bitfocus's packager refuses GPL-3.0-or-later: they
      # require module SOURCE to be MIT so it stays portable, with the
      # distribution licence declared in companion/manifest.json instead. That
      # is a relicensing decision for the owner, not something to work around
      # -- and pinning an older tools version to dodge the check would only
      # move the refusal to submission time.
      #
      # VERIFIED 2026-09-02, THE HARD WAY. Enabling this failed CI with:
      #
      #   LICENSE ERROR: Your module source is licensed as GPL-3.0-or-later in
      #   package.json, but the Companion project requires module source to be
      #   MIT so it stays portable.
      #
      # It builds CLEANLY ON A DEVELOPER MACHINE, which is what made me think
      # this note was wrong and turn the step back on. The check arrived in
      # @companion-module/tools 3.x; package.json asks for ^2.7.2, a stale
      # node_modules keeps serving 2.7.2, and CI's fresh install resolves 3.1.0
      # and enforces it. A tarball built by hand here is not evidence, and
      # neither is a green local run -- only a clean install is.
      #
      # The refusal also names GPL-3.0-only and GPL-2.0-only as acceptable for
      # the PUBLISHED licence, but that clears only the first of the two
      # errors; the second wants MIT source regardless. Untested, because a
      # local test cannot answer this question.
      #
      # Until then the module ships by the OTHER route Companion supports,
      # which needs neither their packager nor their approval: the developer
      # modules folder. The zip below carries the module and its production
      # dependencies, so it unpacks and runs. That turns the instruction for a
      # Companion user from "clone the repository and work it out" into three
      # steps, which matters because those are exactly the people it is for.
      # - name: Companion module package
      #   working-directory: companion-module-utopianacademy-deckboy
      #   run: npx companion-module-build

      - name: Companion module, for the developer modules folder
        run: python3 tools/pack_companion_module.py

      # Attached to the release below. Without this the plugins exist only for
      # someone who clones and builds, which is not how an operator gets one.
      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: Deckboy-plugins
          path: |
            streamdeck-plugin-deckboy/dist/*.streamDeckPlugin
            companion-module-utopianacademy-deckboy/dist/Deckboy-companion-module-*.zip
          if-no-files-found: error

      # Source-level checks, so they need no toolchain and fail before any of
      # the three platform builds start.
      #
      # The show file is POSITIONAL: a field inserted into the middle of the
      # writer shifts every column after it, and the reader goes on addressing
      # the old positions. That skew does not crash -- the wrong values clamp
      # back into range and look plausible, which is how one of them survived
      # years of round-trip smoke tests -- so only comparing the two orders
      # directly will find it.
      - name: The show writer and reader must agree on every column
        run: python3 tools/audit_record_layout.py

      # A QuickAction with no handler, or one nothing can fire, is a control
      # that looks real and does nothing.
      - name: No dead controls
        run: python3 tools/audit_actions.py --strict

      # stateDir() is the only place the app writes, so anything it creates
      # there describes the PACKAGING machine. That list has drifted three
      # times -- a shipped show file, then recent_projects.txt, then
      # _converted/ and recordings/ -- each time fixed with a comment saying
      # "keep these in sync". Comments do not fail builds.
      - name: Packagers strip everything the app writes
        run: python3 tools/audit_packager_strip.py

      # An enum that grew past the bound its loader clamps to loses its newest
      # members on reload -- the cue works all session and comes back as a
      # different thing. Two shipped that way: the 2A03 synth reopened as a
      # test tone, and four of the video synth's palettes reopened as Mono.
      - name: Int-to-enum conversions keep up with their enums
        run: python3 tools/audit_enum_bounds.py

      # The six below were all written after a real fault and then run by hand,
      # which means they were run when somebody remembered. Each passed on the
      # tree the day it was added and there is no reason any of them should
      # ever start failing quietly.

      # A show file is a document people send each other, and the paths in it
      # used to reach std::system() inside double quotes -- which disarm
      # nothing. Opening somebody else's show is meant to be safe.
      - name: Nothing hands a runtime string to a shell
        run: python3 tools/audit_shell_safety.py

      # CHANGES.md becomes the GitHub release body verbatim, and has given away
      # a hidden feature twice -- once key by key.
      - name: Nothing published gives away a secret
        run: python3 tools/audit_spoilers.py

      # HELP is the only description of the remote protocol anybody sees. It
      # has advertised verbs that answer "unknown command", and hidden twelve
      # working ones that could only be found by reading the source.
      - name: HELP describes the protocol that exists
        run: python3 tools/audit_remote_help.py

      # Text that went into the source encoded twice draws as mojibake, and no
      # compiler, test or screenshot review has ever caught one.
      - name: No double-encoded text
        run: python3 tools/audit_encoding.py

      # Both of these are RATCHETS against a recorded baseline rather than a
      # verdict: the counts may be non-zero for good reasons, but they must not
      # grow. Tighten the baseline when the number falls.
      - name: No new UI geometry written in 1x pixels
        run: python3 tools/audit_scaled_layout.py --strict

      # The reachable count is at zero: every setting the show file persists
      # can be changed by a person. Keeping it there is the point.
      - name: Every saved setting can still be reached
        run: python3 tools/audit_reachable.py --strict

  linux-build:
    name: Linux Build (Ubuntu)
    needs: version-check
    # 22.04, NOT ubuntu-latest, and it is the glibc floor that decides it.
    #
    # An AppImage cannot run on an older glibc than the highest version
    # anything inside it needs, and that is set by the binary as much as by
    # the bundled libraries -- which are copied from THIS runner. Built on
    # 24.04 the floor was 2.39, so the download refused to start on 22.04,
    # which is still supported and is what a lot of venue machines run.
    # Nothing of ours caught it: our CI runs the same new image it built on,
    # so the test machine cannot show the fault. The AppImageHub catalogue
    # rig found it in ten minutes.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: none
            cmake_args: "-DENABLE_DECKLINK=OFF -DDECKBOY_ENABLE_NDI=OFF"
          # ENABLE_DECKLINK is ON by default now that the SDK headers are
          # vendored in native/extras/decklink-sdk, so the `all` leg compiles
          # the real capture and playout code on every push. The `none` leg
          # turns it off explicitly, which keeps the no-SDK stub path covered
          # too -- both halves of that file are built, which is what stopped
          # being true when the SDK was a manual download.
          - features: all
            cmake_args: "-DENABLE_MIDI=ON"
    steps:
      - uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git \
            libfreetype-dev libharfbuzz-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libxss-dev libxfixes-dev libxinerama-dev libxtst-dev \
            libdbus-1-dev libibus-1.0-dev libgles2-mesa-dev libdecor-0-dev

      # 22.04 defaults to gcc-11, which is short of C++20. gcc-12 is in the
      # distro's own archive, so the C++ runtime stays the one 22.04 ships --
      # a newer compiler from a PPA would move the GLIBCXX floor instead of
      # the glibc one and land us back where we started.
      - name: Install a C++20 compiler
        run: |
          sudo apt-get install -y gcc-12 g++-12
          echo "CC=gcc-12"  >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      # 22.04's ffmpeg is 4.4, and Deckboy is written against a modern libav:
      # av_find_best_stream took a non-const AVCodec** until 5.0, and
      # ch_layout replaced channel_layout in 5.1. Guarding those would get a
      # Linux build compiling while quietly dropping decode capability that
      # Windows and macOS have, which is not the same product.
      #
      # So the runner gets a current ffmpeg instead, headers and libraries
      # and binaries together. These builds are made against an old glibc on
      # purpose, which is why they do not undo the floor this job exists to
      # lower -- and the floor check below reads the shipped AppImage rather
      # than taking that on trust.
      #
      # It lands in /usr/local, so: pkg-config finds the libraries here,
      # cmake links them, and package_linux.sh -- which takes ffmpeg and
      # ffprobe from PATH -- bundles THESE binaries rather than 4.4.
      - name: Install a current FFmpeg
        run: |
          set -e
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
          curl -fsSL "$url" -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo cp -a /tmp/ffmpeg/bin/. /usr/local/bin/
          sudo cp -a /tmp/ffmpeg/lib/. /usr/local/lib/
          sudo cp -a /tmp/ffmpeg/include/. /usr/local/include/
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          ffmpeg -version | head -1
          pkg-config --modversion libavcodec libavformat libavutil

      - name: Install RtMidi (feature builds)
        if: matrix.features == 'all'
        run: sudo apt-get install -y librtmidi-dev

      # SDL3 is not in every Ubuntu image's archive yet, so try the packages
      # and fall back to building the stable branch from source. Whichever path
      # runs, the result is a normal system install that find_package picks up.
      - name: Install SDL3
        run: |
          set -e
          # 3.4 is the floor, not a preference: the recording readback uses the
          # SDL_GPU renderer's texture property, which does not exist in 3.2.
          # Taking whatever apt happens to ship meant Linux built against 3.2
          # while Windows built against 3.4, and the difference only showed up
          # as a compile error on one of the three.
          if sudo apt-get install -y libsdl3-dev libsdl3-ttf-dev && pkg-config --atleast-version=3.4.0 sdl3; then
            echo "SDL3 $(pkg-config --modversion sdl3) installed from apt"
            exit 0
          fi
          echo "SDL3 >= 3.4 not packaged on this image — building from source"
          git clone --depth 1 --branch release-3.4.x https://github.com/libsdl-org/SDL.git /tmp/SDL
          # 3.4 HARD-FAILS on a missing X11 dev package where 3.2 quietly turned
          # the feature off, so the dependency list above is now load-bearing --
          # it is SDL's documented Linux set rather than the minimum that
          # happened to work, because discovering them one CI run at a time
          # (XScreenSaver, then XTEST, then...) is not a method.
          cmake -S /tmp/SDL -B /tmp/SDL/build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF
          cmake --build /tmp/SDL/build -j"$(nproc)"
          sudo cmake --install /tmp/SDL/build
          # SDL_ttf has no 3.4 branch; 3.2 builds against SDL 3.4 unchanged.
          git clone --depth 1 --branch release-3.2.x --recurse-submodules \
            https://github.com/libsdl-org/SDL_ttf.git /tmp/SDL_ttf
          # HARFBUZZ ON. Without it SDL_ttf cannot shape or reorder, so a
          # right-to-left script draws as unjoined letters in the wrong order --
          # and Deckboy, which checks, refuses to offer those languages at all.
          # Vendored, so this needs nothing from the runner's package list.
          cmake -S /tmp/SDL_ttf -B /tmp/SDL_ttf/build -DCMAKE_BUILD_TYPE=Release             -DSDLTTF_VENDORED=ON -DSDLTTF_HARFBUZZ=ON
          cmake --build /tmp/SDL_ttf/build -j"$(nproc)"
          sudo cmake --install /tmp/SDL_ttf/build
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      # See the Windows job for why these two are worth a gate of their own.
      - name: No hidden names, no unread locals
        run: python3 tools/audit_warnings.py build.log

      # The feature build must have NDI compiled in. The headers are vendored,
      # so this is a guard against the define not reaching the binary: every
      # release until now shipped without NDI while CI stayed green.
      - name: Self-check
        run: |
          ./build/Deckboy --self-check > self-check.txt
          cat self-check.txt
          if [ '${{ matrix.features }}' = 'all' ] && ! grep -q '^ndi-sdk: headers detected' self-check.txt; then
            echo "NDI is not compiled into this build." >&2
            exit 1
          fi

      # ASK THE BINARY, not the build system. The vendored headers prove the
      # SDK was THERE; this proves the define reached the executable. Those
      # are different facts -- the distinction that mattered for NDI above,
      # and exactly how v0.99.370 was first published with a plugin host
      # that could not host anything.
      - name: Plugin host is in the binary
        run: |
          ./build/Deckboy --plugins > plugins.txt 2>&1 || true
          head -3 plugins.txt
          if ! grep -q 'this build can load them' plugins.txt; then
            echo "This build cannot load plugins -- it must not be released." >&2
            exit 1
          fi

      - name: Smoke tests
        run: ./build/Deckboy --smoke

      # A named parameter that moves nothing is a knob the operator turns for
      # no reason. Shatter shipped with its drift and rotation hanging off
      # parameters that arrive at zero, so ADDING the effect did nothing at
      # all, and it sat in a released build for twelve days because this check
      # existed and nothing ran it. It costs about half a minute.
      - name: Every effect, and every knob on it, changes the picture
        if: matrix.features == 'all'
        run: |
          python3 tools/check_effects_offline.py --exe ./build/Deckboy
          python3 tools/check_effects_offline.py --exe ./build/Deckboy --params
          python3 tools/check_effects_offline.py --exe ./build/Deckboy --animation

      - name: Upload artifact
        if: matrix.features == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: Deckboy-linux-${{ needs.version-check.outputs.version }}
          path: build/Deckboy

      # The shippable Linux artefacts. Both packagers default to build/, which
      # is where this job already built, so they need nothing but ffmpeg —
      # which they BUNDLE, so the tarball runs on a machine that has none.
      - name: Package portable tarball and AppImage
        if: matrix.features == 'all'
        run: |
          sudo apt-get install -y file desktop-file-utils
          ./tools/package_linux.sh
          ./tools/package_linux_appimage.sh

      # PROVE the floor rather than trusting the runner label. An AppImage
      # will not start on an older glibc than the highest version anything
      # inside it needs, and that is a SILENT failure: the file downloads,
      # the loader refuses it, and nothing in a build goes red. This reads
      # the symbols out of every ELF in the AppImage that was just built,
      # which also catches a dependency dragging the floor back up.
      - name: The AppImage must run on 22.04 (glibc 2.35)
        if: matrix.features == 'all'
        run: |
          set -e
          cd dist
          chmod +x Deckboy-*.AppImage
          ./Deckboy-*.AppImage --appimage-extract > /dev/null
          worst=2.0
          where=""
          for f in $(find squashfs-root -type f); do
            case "$(file -b "$f")" in *ELF*) ;; *) continue ;; esac
            v=$(objdump -T "$f" 2>/dev/null | grep -o "GLIBC_[0-9.]*" | sed "s/GLIBC_//" | sort -V | tail -1)
            [ -n "$v" ] || continue
            highest=$(printf "%s\n%s\n" "$worst" "$v" | sort -V | tail -1)
            if [ "$highest" = "$v" ] && [ "$v" != "$worst" ]; then
              worst="$v"
              where="$f"
            fi
          done
          echo "highest glibc required: $worst  ($where)"
          if [ "$(printf "2.35\n%s\n" "$worst" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::The AppImage needs glibc $worst, so it cannot start on Ubuntu 22.04 (2.35). Raised by: $where"
            exit 1
          fi
          rm -rf squashfs-root

      # A tarball that unpacks to nothing, or an AppImage that will not start,
      # is worse than no artefact: it looks like a release. Both are exercised
      # here rather than trusted.
      - name: The packaged builds must actually run
        if: matrix.features == 'all'
        run: |
          set -e
          mkdir -p /tmp/unpack
          tar -xzf dist/Deckboy-*.tar.gz -C /tmp/unpack
          BIN="$(find /tmp/unpack -name Deckboy -type f | head -1)"
          "$BIN" --self-check
          "$BIN" --smoke
          # Deckboy-* explicitly: appimagetool is also a .AppImage and lives in
          # the same directory, and which one a bare glob picks first
          # depends on the locale.
          APPIMAGE="$(ls dist/Deckboy-*.AppImage | head -1)"
          chmod +x "$APPIMAGE"
          # --appimage-extract-and-run: the runners have no FUSE.
          "$APPIMAGE" --appimage-extract-and-run --self-check

      - name: Upload Linux packages
        if: matrix.features == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-linux-packages
          path: |
            dist/Deckboy-*.tar.gz
            dist/Deckboy-*.AppImage
          if-no-files-found: error

  macos-build:
    name: macOS Build (Apple Silicon/Intel)
    needs: version-check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: none
            cmake_args: "-DENABLE_DECKLINK=OFF -DDECKBOY_ENABLE_NDI=OFF"
          - features: all
            cmake_args: "-DENABLE_MIDI=ON"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake pkg-config sdl3 sdl3_ttf ffmpeg libltc

      - name: Install RtMidi (feature builds)
        if: matrix.features == 'all'
        run: brew install rtmidi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # The feature build must have NDI compiled in. The headers are vendored,
      # so this is a guard against the define not reaching the binary: every
      # release until now shipped without NDI while CI stayed green.
      - name: Self-check
        run: |
          ./build/Deckboy --self-check > self-check.txt
          cat self-check.txt
          if [ '${{ matrix.features }}' = 'all' ] && ! grep -q '^ndi-sdk: headers detected' self-check.txt; then
            echo "NDI is not compiled into this build." >&2
            exit 1
          fi

      # ASK THE BINARY, not the build system. The vendored headers prove the
      # SDK was THERE; this proves the define reached the executable. Those
      # are different facts -- the distinction that mattered for NDI above,
      # and exactly how v0.99.370 was first published with a plugin host
      # that could not host anything.
      - name: Plugin host is in the binary
        run: |
          ./build/Deckboy --plugins > plugins.txt 2>&1 || true
          head -3 plugins.txt
          if ! grep -q 'this build can load them' plugins.txt; then
            echo "This build cannot load plugins -- it must not be released." >&2
            exit 1
          fi

      - name: Smoke tests
        run: ./build/Deckboy --smoke

      # The settings menus, photographed on a real Mac.
      #
      # macOS is the one platform whose UI cannot be checked by hand from here:
      # a GUI app will not render from an ssh session, `screencapture` over ssh
      # has no Screen Recording grant, and granting one needs somebody at the
      # keyboard. --ui-dump reads back our own renderer, so the runner can take
      # the picture for us. Never fails the build -- it is evidence, not a gate.
      - name: Settings menu screenshots
        if: matrix.features == 'all'
        continue-on-error: true
        run: |
          set +e
          mkdir -p ui-shots
          export DECKBOY_ROOT="$RUNNER_TEMP/deckboy-uiroot"
          mkdir -p "$DECKBOY_ROOT/data"
          for d in themes ui sprites fonts; do
            [ -d "data/$d" ] && cp -R "data/$d" "$DECKBOY_ROOT/data/$d"
          done
          cp data/*.ttf "$DECKBOY_ROOT/data/" 2>/dev/null
          for tab in 0 1 2 3.1 3.2 5; do
            name=$(echo "$tab" | tr '.' '_')
            ./build/Deckboy --settings "$tab" --ui-dump "ui-shots/macos_tab${name}.bmp" 150
            echo "tab $tab -> rc=$?"
          done
          # The splash, with a seeded recents list -- it is the first thing an
          # operator sees and the one screen that is different on a fresh
          # install, so it is worth a picture of its own.
          mkdir -p "$RUNNER_TEMP/shows/Playhouse" "$RUNNER_TEMP/shows/Gigs"
          printf 'ui_scale\t1.0\n' > "$RUNNER_TEMP/shows/Playhouse/house-rig.deckboy"
          printf 'ui_scale\t1.0\n' > "$RUNNER_TEMP/shows/Gigs/gig-night.deckboy"
          {
            echo "$RUNNER_TEMP/shows/Playhouse/house-rig.deckboy"
            echo "$RUNNER_TEMP/shows/Gigs/gig-night.deckboy"
          } > "$DECKBOY_ROOT/data/recent_projects.txt"
          ./build/Deckboy --ui-dump "ui-shots/macos_splash.bmp" 400
          echo "splash -> rc=$?"
          ls -la ui-shots || true

      - name: Upload settings screenshots
        if: matrix.features == 'all'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-macos-ui-shots
          path: ui-shots/
          if-no-files-found: warn

  macos-package:
    name: macOS Portable Bundle
    needs: macos-build
    # PINNED, NOT macos-latest. The bundle carries Homebrew's dylibs, and a
    # bottle is built for the runner's own macOS -- so whatever image this job
    # lands on becomes the oldest macOS the release can open on. On
    # macos-latest that silently tracked GitHub's newest image, and the build
    # stopped opening on Sonoma.
    #
    # There is no universal binary (see tools/package_macos.sh), so both
    # architectures are built and the packager names each zip after its own.
    #
    # macos-13 WAS the Intel slot, until GitHub retired that image. A retired
    # label does not fail -- the job simply queues for a runner that will never
    # come. macos-package needs both matrix entries, and publish needs
    # macos-package, so every release after that sat "queued" forever and
    # NOTHING published. v0.99.317 was tagged, built green on all six other
    # jobs, and never produced a release; the same would have happened to every
    # tag after it, silently, because a queued job looks like a slow one.
    #
    # macos-15-intel is GitHub's Intel image now. If that is ever retired too,
    # the symptom will be identical -- a job stuck in "queued" -- so check the
    # runner label before suspecting the build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-15-intel  # x86_64
          - image: macos-14        # arm64, floor macOS 14 Sonoma
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake pkg-config sdl3 sdl3_ttf ffmpeg libltc

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
           
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        # The signing/notarisation env is passed through from repo secrets. When
        # the secrets are unset (forks, the default free path) these expand to
        # empty and the packager stays ad-hoc — nothing here requires an Apple
        # account. Wiring the .p8 from a secret needs a file, so it is only
        # materialised when the secret exists.
        env:
          DECKBOY_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          DECKBOY_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          DECKBOY_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          chmod +x tools/package_macos.sh
          if [ -n "$MACOS_NOTARY_KEY_P8_BASE64" ]; then
            printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
            export DECKBOY_NOTARY_KEY_P8="$RUNNER_TEMP/notary.p8"
          fi
          ./tools/package_macos.sh
          rm -f "$RUNNER_TEMP/notary.p8"

      # The whole point of the bundle is that it runs on a machine with no
      # Homebrew. A leftover /opt/homebrew or /usr/local reference in ANY
      # binary means it does not — and that failure only shows up on the
      # target machine, which is exactly where it is most expensive.
      - name: Verify no Homebrew paths leak into the bundle
        run: |
          APP=$(find dist/staging -maxdepth 2 -name 'Deckboy.app' | head -1)
          echo "Bundle: $APP"
          leaked=0
          while IFS= read -r bin; do
            refs=$(otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                   | grep -E '^(/opt/homebrew|/usr/local)' || true)
            if [ -n "$refs" ]; then
              echo "::error::$bin still references:"; echo "$refs"; leaked=1
            fi
          done < <(find "$APP" -type f \( -perm +111 -o -name '*.dylib' \))
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
          echo "clean - every dependency is bundled"

      # install_name_tool invalidates signatures, and an unsigned/broken-signed
      # binary is killed on sight by Apple Silicon. This proves the re-sign step
      # actually took.
      - name: Verify code signature
        run: |
          APP=$(find dist/staging -maxdepth 2 -name 'Deckboy.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Run the app FROM INSIDE THE BUNDLE, so this exercises the rewritten
      # @rpath resolution and the bundled data/ directory, not the build tree.
      - name: Run self-check and smoke from the bundle
        run: |
          APP=$(find dist/staging -maxdepth 2 -name 'Deckboy.app' | head -1)
          "$APP/Contents/MacOS/Deckboy" --self-check
          "$APP/Contents/MacOS/Deckboy" --smoke
          "$APP/Contents/MacOS/ffmpeg" -version | head -1

      # THE test this job was missing. The earlier version ran --self-check with
      # the runner's normal PATH, which has Homebrew ffmpeg on it — so it
      # reported "ffmpeg: ok" and could not have detected that the BUNDLED
      # ffmpeg was unreachable. It didn't: the app spawns helpers by bare name
      # through execvp, which searches PATH only, and nothing put the bundle on
      # PATH. Clearing PATH is what makes this check mean anything.
      #
      # The control case runs first, so a silently-passing test can't masquerade
      # as a real one.
      - name: Bundled ffmpeg must be reachable with PATH cleared
        run: |
          APP=$(find dist/staging -maxdepth 2 -name 'Deckboy.app' | head -1)
          cp -R "$APP" "$RUNNER_TEMP/Relocated.app"   # also proves relocatability

          echo "--- control: PATH cleared, bundled ffmpeg moved aside (expect missing) ---"
          mv "$RUNNER_TEMP/Relocated.app/Contents/MacOS/ffmpeg" "$RUNNER_TEMP/ff.hidden"
          control=$(env -i HOME="$HOME" PATH=/nonexistent \
            "$RUNNER_TEMP/Relocated.app/Contents/MacOS/Deckboy" --self-check 2>&1 | grep '^ffmpeg:' || true)
          echo "$control"
          case "$control" in
            *missing*) echo "control ok - the test can detect failure" ;;
            *) echo "::error::control did not report missing; this check proves nothing"; exit 1 ;;
          esac

          echo "--- real: PATH cleared, bundled ffmpeg present (expect ok) ---"
          mv "$RUNNER_TEMP/ff.hidden" "$RUNNER_TEMP/Relocated.app/Contents/MacOS/ffmpeg"
          real=$(env -i HOME="$HOME" PATH=/nonexistent \
            "$RUNNER_TEMP/Relocated.app/Contents/MacOS/Deckboy" --self-check 2>&1 | grep '^ffmpeg:' || true)
          echo "$real"
          case "$real" in
            *ok*) echo "bundled ffmpeg is genuinely reachable" ;;
            *) echo "::error::bundled ffmpeg NOT reachable with PATH cleared"; exit 1 ;;
          esac

      - name: Confirm build-machine state was stripped
        run: |
          APP=$(find dist/staging -maxdepth 2 -name 'Deckboy.app' | head -1)
          for stale in last_project.txt default.deckboy; do
            if [ -e "$APP/Contents/Resources/data/$stale" ]; then
              echo "::error::data/$stale shipped in the bundle"; exit 1
            fi
          done
          echo "no per-machine state in the bundle"

      # The .dmg must exist, mount, and contain both the app and the
      # /Applications drag target. A dmg that will not mount is worse than none.
      - name: Verify the .dmg mounts and is a real installer
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "dmg: $DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          test -d "$MNT/Deckboy.app" || { echo "::error::no Deckboy.app in dmg"; exit 1; }
          test -L "$MNT/Applications" || { echo "::error::no /Applications drag target"; exit 1; }
          echo "dmg mounts, contains Deckboy.app + Applications shortcut"
          hdiutil detach "$MNT" -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: deckboy-macos-portable-${{ matrix.image }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  windows-build:
    name: Windows Build (MSVC)
    needs: version-check
    # Pinned rather than windows-latest: CMake needs a concrete Visual Studio,
    # and "latest" moving to a newer image is what broke this job before.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: none
            cmake_args: "-DENABLE_DECKLINK=OFF -DDECKBOY_ENABLE_NDI=OFF"
          - features: all
            cmake_args: "-DENABLE_MIDI=ON -DENABLE_SPOUT=ON -DENABLE_WEBVIEW=ON"
    steps:
      - uses: actions/checkout@v4

      # No explicit -G: the runner image's newest Visual Studio is whatever
      # CMake defaults to. Pinning "Visual Studio 17 2022" is what broke these
      # builds when the hosted image moved on ("could not find any instance of
      # Visual Studio").
      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.features }}-sdl3-webview2
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install dependencies
        run: .\vcpkg\vcpkg install sdl3:x64-windows sdl3-ttf:x64-windows

      # ENABLE_SPOUT hard-fails without the SDK, so the feature build needs
      # spout2 as well as rtmidi.
      #
      # WEBVIEW2 IS REQUIRED HERE, NOT DETECTED. CMake looks for it QUIETLY
      # when ENABLE_WEBVIEW is off, and nothing here ever installed it -- so
      # every release was built without browser cues, and they fell back to
      # launching Edge full screen and grabbing it. The build stayed green
      # throughout, because a quiet search that finds nothing is not an
      # error. The feature build now passes -DENABLE_WEBVIEW=ON, which makes
      # the search REQUIRED: if webview2 ever stops installing, this fails.
      #
      # Deliberately NOT in the shared install step above. The features=none
      # build exists to prove Deckboy works without the optional pieces, and
      # the quiet auto-detect would pick webview2 up there too and leave
      # nothing exercising the fallback.
      - name: Install feature dependencies
        if: matrix.features == 'all'
        run: .\vcpkg\vcpkg install rtmidi:x64-windows spout2:x64-windows webview2:x64-windows

      # FFmpeg dev libraries are deliberately not installed here: the vcpkg
      # port builds from source and dominates CI time. DECKBOY_INPROC_DECODE
      # degrades to the ffmpeg-CLI decode path with a warning, and the
      # in-process decoder is still compiled on Linux and macOS.
      # bash + an absolute, quoted toolchain path. The folded-scalar form under
      # PowerShell split the argument and dropped the ".cmake" suffix
      # ("Could not find toolchain file: .../vcpkg" + "Ignoring extra path .cmake").
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee build.log

      # A name that hides another, or a local nothing reads. Both have cost
      # real time here: a duplicated block whose second copy shadowed the first
      # meant a fix applied to half the cases, and an unread local gave a later
      # loop something to shadow. CMakeLists promotes exactly these two out of
      # warning level 4, where they sat among several hundred int-to-float
      # conversions into SDL's float APIs and nobody was ever going to see them.
      - name: No hidden names, no unread locals
        shell: bash
        run: python tools/audit_warnings.py build.log

      # Start-Process -Wait, NOT the call operator.
      #
      # Deckboy is a GUI-subsystem binary and PowerShell does not wait for
      # those: the call returns immediately, $LASTEXITCODE is never set from it,
      # and the step passes whatever the app actually did. Both of these gates
      # had been vacuous on Windows for exactly that reason — the tell is that
      # the app's output arrives in the log AFTER the step that supposedly ran
      # it. Linux and macOS were never affected; their binaries are console
      # subsystem and the shell waits.
      - name: Self-check
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\build\Release\Deckboy.exe `
                 -ArgumentList "--self-check" -Wait -NoNewWindow -PassThru `
                 -RedirectStandardOutput self-check.txt
          Get-Content self-check.txt
          if ($p.ExitCode -ne 0) { throw "self-check failed ($($p.ExitCode))" }
          if ('${{ matrix.features }}' -eq 'all' -and
              -not (Select-String -Path self-check.txt -Pattern '^ndi-sdk: headers detected' -Quiet)) {
            throw "NDI is not compiled into this build."
          }

      - name: Smoke tests
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\build\Release\Deckboy.exe `
                 -ArgumentList "--smoke" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke tests failed ($($p.ExitCode))" }

      # The shippable Windows artefacts. The installer script stages the
      # portable payload itself, so one call produces BOTH the zip and the
      # setup.exe — they cannot drift apart because they are the same staging
      # directory.
      #
      # ffmpeg is bundled into the payload rather than required on the operator's
      # machine, so it has to be present here to be copied.
      - name: Install ffmpeg and Inno Setup
        if: matrix.features == 'all'
        run: choco install ffmpeg innosetup -y --no-progress

      - name: Package portable zip and installer
        if: matrix.features == 'all'
        shell: pwsh
        run: |
          # The REAL binaries, not Chocolatey's shims.
          #
          # `Get-Command ffmpeg` resolves to a shim in chocolatey\bin, and a shim
          # copied into the package is a stub that looks for a binary the
          # operator's machine has never had. The package must carry the actual
          # ffmpeg.exe and ffprobe.exe, so find them in choco's library.
          $real = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse `
                    -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                  Where-Object { Test-Path (Join-Path $_.DirectoryName "ffprobe.exe") } |
                  Select-Object -First 1
          if (-not $real) { throw "no real ffmpeg.exe/ffprobe.exe pair found to bundle" }
          $ffmpeg = $real.DirectoryName
          Write-Host "bundling ffmpeg from $ffmpeg"
          # -BuildDir because CI builds to build\Release, while the script's
          # default is the build\windows\Release a local build uses.
          .\tools\package_windows_installer.ps1 -FfmpegDir $ffmpeg -BuildDir "build\Release"

      # An installer nobody has run is a guess. This unpacks the portable zip
      # and starts the binary out of it, which is the same payload the setup.exe
      # installs.
      - name: The packaged build must actually run
        if: matrix.features == 'all'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\Deckboy-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist\unpack -Force
          $exe = Get-ChildItem dist\unpack -Recurse -Filter Deckboy.exe | Select-Object -First 1
          # Start-Process for the same reason as the gates above: the call
          # operator does not wait for a GUI binary and leaves $LASTEXITCODE
          # unset, which is how this step first reported a failure with no exit
          # code in it at all.
          $selfCheck = (Start-Process -FilePath $exe.FullName `
                          -ArgumentList "--self-check" `
                          -Wait -NoNewWindow -PassThru `
                          -RedirectStandardOutput dist\packaged-self-check.txt).ExitCode
          Get-Content dist\packaged-self-check.txt
          $smoke = (Start-Process -FilePath $exe.FullName `
                      -ArgumentList "--smoke" `
                      -Wait -NoNewWindow -PassThru).ExitCode
          # Reported as NUMBERS before anything is thrown. A bare "it failed"
          # cannot tell a deliberate non-zero apart from a crash on the way out,
          # and the difference is the whole diagnosis: 1 is the app saying no,
          # -1073741819 is an access violation.
          Write-Host "self-check exit: $selfCheck   smoke exit: $smoke"
          if ($selfCheck -ne 0 -or $smoke -ne 0) {
            Write-Host "--- what the package actually contains ---"
            Get-ChildItem $exe.DirectoryName | Select-Object Name, Length |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "the packaged build did not run (self-check $selfCheck, smoke $smoke)"
          }
          # What the product page claims about window cues -- full resolution
          # whatever the display scaling, follows the window, unaffected by
          # anything in front of it -- rests on the BUNDLED ffmpeg carrying
          # the graphics-capture source, which arrived in 8.0. Move that pin
          # backwards and the behaviour goes away silently: window cues still
          # work, on the old screen-grab path, and nothing fails. The claim
          # would simply stop being true with nobody having written a word.
          # Checked on the unpacked package, because the bundle is what an
          # operator downloads -- the build tree borrows whatever ffmpeg the
          # runner happens to have.
          if (-not (Select-String -Path dist\packaged-self-check.txt -Pattern '^window-capture: exact' -Quiet)) {
            Write-Host "--- what the package says ---"
            Get-Content dist\packaged-self-check.txt | Write-Host
            throw "The packaged build falls back to screen-grab window capture: its bundled ffmpeg has no graphics-capture source."
          }
          # And the same question for plugins, asked of the ZIP an operator
          # downloads rather than of the build tree. v0.99.370 shipped every
          # platform advertising VST3 hosting with the host compiled out: the
          # binaries listed the operator's plugins and refused to load them,
          # and nothing anywhere went red. A claim on the product page needs a
          # gate on the package, not on the source.
          $plugins = (Start-Process -FilePath $exe.FullName `
                       -ArgumentList "--plugins" `
                       -Wait -NoNewWindow -PassThru `
                       -RedirectStandardOutput dist\packaged-plugins.txt).ExitCode
          Get-Content dist\packaged-plugins.txt | Select-Object -First 3 | Write-Host
          if (-not (Select-String -Path dist\packaged-plugins.txt -Pattern 'this build can load them' -Quiet)) {
            throw "The packaged build cannot host plugins. It must not be released claiming it can."
          }


      - name: Upload Windows packages
        if: matrix.features == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-windows-packages
          path: |
            dist/Deckboy-*.zip
            dist/Deckboy-*-setup.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish, on a tag only.
  #
  # Before this, every artefact was built and then thrown away: the macOS .dmg
  # was made on every run and attached to nothing, the Windows zip was built by
  # hand on a developer's machine, and Linux shipped nothing at all. The README
  # promised an installer and a portable build for all three, and only the macOS
  # half of that was ever true.
  #
  # Nothing is BUILT here. Everything is downloaded from the jobs that already
  # tested it, so the file published is the same file that ran --smoke.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, companion-module, linux-build, macos-package, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the shippable files
        run: |
          set -e
          mkdir -p release
          # Deckboy-* only. The AppImage packager downloads appimagetool INTO
          # dist/, and it is itself a .AppImage -- so a bare extension match
          # publishes the build tool as though it were the product.
          find artifacts -type f \( \
            -name 'Deckboy-*.zip' -o -name 'Deckboy-*.dmg' \
            -o -name 'Deckboy-*-setup.exe' -o -name 'Deckboy-*.tar.gz' \
            -o -name 'Deckboy-*.AppImage' \
            -o -name '*.streamDeckPlugin' \
            -o -name 'Deckboy-companion-module-*.zip' \) \
            -exec cp -v {} release/ \;
          ls -la release

      # Eight files: an installer and a portable build for each of the three
      # platforms, plus the Stream Deck plugin and the Companion module.
      # Anything missing means a packaging job
      # silently produced nothing, and a half-empty release is worse than a
      # failed build.
      - name: Every platform must have shipped something
        run: |
          set -e
          cd release
          for pattern in '*-windows-x64.zip' '*-windows-x64-setup.exe' \
                         '*-macos-*.zip' '*.dmg' '*.tar.gz' '*.AppImage' \
                         '*.streamDeckPlugin' \
                         'Deckboy-companion-module-*.zip'; do
            count=$(ls $pattern 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "MISSING: nothing matched $pattern" >&2
              exit 1
            fi
          done
          echo "all eight artefacts present"

      # A CHANGELOG ENTRY IS NOT A RELEASE PAGE.
      #
      # This step used to paste the changelog section into the release body and
      # stop, which is why the pages read as fragments: no heading, no downloads,
      # nothing telling a first-time visitor which of seven files to click or
      # what to do about the unsigned-build warning. VLC keeps the two separate
      # for exactly this reason -- NEWS is a terse engineering changelog, the
      # release announcement is a product page -- and Deckboy had one file doing
      # both jobs and therefore neither.
      #
      # The changelog section stays the source of WHAT CHANGED, so the release
      # page and CHANGES.md still cannot disagree. Everything around it is built
      # here from the artefacts that actually got published.
      - name: Build the release page
        run: |
          python3 - <<'PY'
          import io, os, re
          version = os.environ["VERSION"]
          text = io.open("CHANGES.md", encoding="utf-8").read()
          start = re.search(r"^## .*v%s\b.*$" % re.escape(version), text, re.M)
          if not start:
              raise SystemExit("no CHANGES.md section for v%s" % version)
          # The changelog heading already carries a summary -- "(the audio chain
          # reaches Companion)" -- and none of it reached the release title, which
          # was "Deckboy v0.99.357" and said nothing at all. A release page is the
          # best-ranking thing this project has: searching for Deckboy returns one
          # ABOVE the repository. The title is what somebody decides to click, so
          # it should say what the release actually does.
          summary = re.search(r"\(([^)]+)\)\s*$", start.group(0))
          title = "Deckboy v%s" % version
          if summary:
              title += " \u2014 " + summary.group(1).strip()
          io.open("release-title.txt", "w", encoding="utf-8").write(title)
          print("release title: " + title)

          # The title is GENERATED from the changelog heading, and a heading may
          # legitimately name something the release pages must not. "(vivid
          # Terrarium)" is a fine changelog line and was a terrible release title,
          # which is exactly what shipped before this check existed. Fall back to
          # the bare version rather than failing the release over a summary.
          import subprocess, sys
          # sys.executable, not "python3" -- the interpreter already running this
          # is by definition present, and hardcoding a name meant the gate could
          # not RUN on a machine without it. That failure looked identical to a
          # rejection and silently degraded a perfectly good title.
          gate = subprocess.run(
              [sys.executable, "tools/audit_spoilers.py", "--text", title],
              capture_output=True, text=True)
          if gate.returncode == 1 and gate.stdout.strip():
              print("title rejected: " + gate.stdout.strip())
              title = "Deckboy v%s" % version
              io.open("release-title.txt", "w", encoding="utf-8").write(title)
              print("release title: " + title)
          elif gate.returncode != 0:
              raise SystemExit("the spoiler audit could not run: "
                               + (gate.stderr or gate.stdout).strip()[:300])

          rest = text[start.end():]
          nxt = re.search(r"^## \d{4}-", rest, re.M)
          body = (rest[: nxt.start()] if nxt else rest).strip()

          # Name the files from what is actually in release/, so a renamed or
          # missing artefact shows up as a gap in the table rather than as a
          # dead link. The artefact check above has already refused to publish
          # if any of the seven are absent.
          have = sorted(os.listdir("release"))
          def find(*fragments):
              for name in have:
                  if all(f in name for f in fragments):
                      return "`%s`" % name
              return "—"

          rows = [
              ("**Windows**",              find("windows-x64-setup.exe"), find("windows-x64.zip")),
              ("**macOS** (Apple Silicon)", find("macos-arm64.dmg"),       find("macos-arm64.zip")),
              ("**macOS** (Intel)",         find("macos-x86_64.dmg"),      find("macos-x86_64.zip")),
              ("**Linux** (x86_64)",        find(".AppImage"),             find("linux-x86_64.tar.gz")),
          ]

          page = []
          page.append(body)
          page.append("")
          page.append("## Downloads")
          page.append("")
          page.append("| Platform | Installer | Portable |")
          page.append("|---|---|---|")
          for row in rows:
              page.append("| %s | %s | %s |" % row)
          page.append("")
          page.append("Every build carries what it needs — the binary, ffmpeg and "
                      "its runtime libraries. Nothing else to install.")
          page.append("")
          page.append("### Control surfaces")
          page.append("")
          page.append("| Surface | File | How |")
          page.append("|---|---|---|")
          page.append("| **Stream Deck** | %s | Double-click it. |" % find(".streamDeckPlugin"))
          page.append("| **Bitfocus Companion** | %s | Unzip it somewhere permanent, then point "
                      "Companion's *developer modules path* at the folder containing it. "
                      "INSTALL.txt inside has the three steps. |"
                      % find("Deckboy-companion-module-", ".zip"))
          page.append("")
          page.append("### First run")
          page.append("")
          page.append("Deckboy is free software and is not code-signed, so the OS "
                      "does not recognise the publisher. One time only:")
          page.append("")
          page.append("- **macOS** — if it says the app is damaged: "
                      "`xattr -dr com.apple.quarantine /Applications/Deckboy.app`")
          page.append("- **Windows** — SmartScreen may appear: **More info → Run anyway**")
          page.append("")
          page.append("---")
          page.append("")
          # A release page is where most strangers arrive: a search lands on
          # a version tag, not on the front page, and until now the only way
          # out of one was the changelog. Somebody who has never heard of
          # Deckboy should be able to tell what it is and where to read more
          # without leaving GitHub first.
          site = "https://utopian-academy.github.io/Deckboy/"
          repo = os.environ.get("GITHUB_REPOSITORY", "Utopian-Academy/Deckboy")
          # Only what the download itself does. NDI video needs the NDI SDK at
          # build time and CI releases do not have it yet, so it is not named.
          # Outputs are joined with "or": simultaneity is claimed only for what
          # was tested on a release -- a stream and a recording of the same
          # picture, and presenter view beside the programme.
          page.append("**Deckboy** is free, open-source cue-based media playback "
                      "and show control for live video — clips, slides and live "
                      "sources on one cue list, out to a screen, SRT or Blackmagic "
                      "SDI, with a stream and a recording running at the same time "
                      "and presenter view on its own display, driven from a Stream "
                      "Deck, Bitfocus Companion, OSC, MIDI or LTC timecode.")
          page.append("")
          page.append("[What it does](%s) · [Manual](%smanual.html) · "
                      "[How it compares](%scompare.html) · [FAQ](%sfaq.html) · "
                      "[Full history](https://github.com/%s/blob/main/CHANGES.md)"
                      % (site, site, site, site, repo))

          out = "\n".join(page).rstrip() + "\n"
          io.open("release-notes.md", "w", encoding="utf-8").write(out)
          print("release page: %d characters, %d artefacts listed"
                % (len(out), sum(1 for r in rows for c in r[1:] if c != "—")))
          PY
        env:
          VERSION: ${{ needs.version-check.outputs.version }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md \
            release/*

          # The release this one replaces now says so. Search engines keep old
          # release pages, and people arrive on them and download whatever is
          # in front of them -- a page two weeks stale gave no hint that anything
          # newer existed. A release cannot carry this when it is created,
          # because at that moment it IS the newest, so it is added to the
          # previous one here. releases/latest always redirects, so the line
          # never needs updating. Guarded on its own text so it cannot stack.
          previous=$(gh release list --exclude-drafts --limit 2 --json tagName --jq ".[1].tagName // empty")
          if [ -n "$previous" ] && [ "$previous" != "v$VERSION" ]; then
            gh release view "$previous" --json body --jq .body > previous-body.md
            if ! grep -q "This is an older release" previous-body.md; then
              {
                echo "> **This is an older release.** The current version is always at [releases/latest](https://github.com/${{ github.repository }}/releases/latest)."
                echo
                cat previous-body.md
              } > previous-notes.md
              gh release edit "$previous" --notes-file previous-notes.md
              echo "marked $previous as superseded"
            fi
          fi
