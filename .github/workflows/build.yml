name: Deckboy CI

on:
  push:
    branches: [deckboy-0.75]
    tags:
      - 'v*'
  pull_request:
    branches: [deckboy-0.75]
  workflow_dispatch:

jobs:
  version-check:
    name: Version Guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must use SemVer: MAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            expected="v$version"
            if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${expected}" >&2
              exit 1
            fi
          fi

  linux-build:
    name: Linux Build (Ubuntu)
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [none, midi, decklink, all]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libfmt-dev
      
      - name: Install RtMidi (MIDI tests)
        if: matrix.features == 'midi' || matrix.features == 'all'
        run: sudo apt-get install -y librtmidi-dev
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Configure (no features)
        if: matrix.features == 'none'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
      
      - name: Configure (with MIDI)
        if: matrix.features == 'midi'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_MIDI=ON
      
      - name: Configure (with DeckLink stubs)
        if: matrix.features == 'decklink'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_DECKLINK=ON
      
      - name: Configure (all features)
        if: matrix.features == 'all'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_MIDI=ON \
            -DENABLE_DECKLINK=ON
      
      - name: Build
        run: |
          cd build
          make -j$(nproc)
      
      - name: Self-check
        run: |
          cd build
          ./deckboy-native --self-check
      
      - name: Upload artifact
        if: matrix.features == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-native-linux-${{ needs.version-check.outputs.version }}
          path: build/deckboy-native

  macos-build:
    name: macOS Build (Apple Silicon/Intel)
    needs: version-check
    runs-on: macos-latest
    strategy:
      matrix:
        features: [none, midi, siphon, all]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install cmake sdl2 sdl2_ttf pkg-config
      
      - name: Install RtMidi (MIDI tests)
        if: matrix.features == 'midi' || matrix.features == 'all'
        run: brew install rtmidi
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Configure (no features)
        if: matrix.features == 'none'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      
      - name: Configure (with MIDI)
        if: matrix.features == 'midi'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DENABLE_MIDI=ON
      
      - name: Configure (with Siphon stubs)
        if: matrix.features == 'siphon'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DENABLE_SIPHON=ON
      
      - name: Configure (all features)
        if: matrix.features == 'all'
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DENABLE_MIDI=ON \
            -DENABLE_SIPHON=ON
      
      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)
      
      - name: Self-check
        run: |
          cd build
          ./deckboy-native --self-check
      
      - name: Upload artifact
        if: matrix.features == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-native-macos-${{ needs.version-check.outputs.version }}
          path: build/deckboy-native

  windows-build:
    name: Windows Build (MSVC)
    needs: version-check
    runs-on: windows-latest
    strategy:
      matrix:
        features: [none, midi, spout, all]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
      
      - name: Install dependencies
        run: |
          .\vcpkg\vcpkg install `
            sdl2:x64-windows `
            sdl2-ttf:x64-windows
      
      - name: Install RtMidi (MIDI tests)
        if: matrix.features == 'midi' || matrix.features == 'all'
        run: |
          .\vcpkg\vcpkg install rtmidi:x64-windows
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Configure (no features)
        if: matrix.features == 'none'
        run: |
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake
      
      - name: Configure (with MIDI)
        if: matrix.features == 'midi'
        run: |
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DENABLE_MIDI=ON
      
      - name: Configure (with Spout stubs)
        if: matrix.features == 'spout'
        run: |
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DENABLE_SPOUT=ON
      
      - name: Configure (all features)
        if: matrix.features == 'all'
        run: |
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DENABLE_MIDI=ON `
            -DENABLE_SPOUT=ON
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release -j (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
      
      - name: Self-check
        run: |
          cd build\Release
          .\deckboy-native.exe --self-check
      
      - name: Upload artifact
        if: matrix.features == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: deckboy-native-windows-${{ needs.version-check.outputs.version }}
          path: build\Release\deckboy-native.exe
