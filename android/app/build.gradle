plugins {
     id 'com.android.application'
}

def buildWithCMake = true

android {
    namespace = "io.github.utopian_academy.deckboy.pocket"
    compileSdkVersion 35
    ndkVersion = "27.3.13750724"
    defaultConfig {
        applicationId "io.github.utopian_academy.deckboy.pocket"
        minSdkVersion 29
        targetSdkVersion 35
        // The version is Deckboy's (the repo's VERSION file, the one source of
        // truth): 0.99.430 -> versionName "0.99.430", versionCode 99430, so
        // every release installs over the one before.
        def deckboyVersion = file("../../VERSION").text.trim()
        def parts = deckboyVersion.tokenize('.').collect { it as int }
        versionName deckboyVersion
        versionCode parts[0] * 10000000 + parts[1] * 1000 + parts[2]
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-29"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DPOCKET_DEPS=" + (System.getenv("POCKET_DEPS") ?: "X:/android")
                targets "main"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    // RELEASE SIGNING. The key never lives in the repo: DECKBOY_POCKET_SIGNING
    // names a properties file (storeFile, storePassword, keyAlias, keyPassword)
    // kept with the keystore. Every update must be signed with the same key or
    // phones refuse it, so the keystore is backed up by its owner. Without the
    // variable a release build comes out unsigned.
    def signingFile = System.getenv("DECKBOY_POCKET_SIGNING")
    if (signingFile && new File(signingFile).exists()) {
        def props = new Properties()
        new File(signingFile).withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile new File(props.storeFile)
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingFile && new File(signingFile).exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

// Deckboy's data that Pocket ships (fonts, the Pocket theme), copied into the
// APK's assets; the app copies them out to its own storage on first launch.
def pocketAssets = layout.buildDirectory.dir("pocket-assets")
tasks.register("copyPocketAssets", Copy) {
    from("${rootDir}/../data") {
        include "PressStart2P.ttf", "fonts/LiberationSans-Regular.ttf", "fonts/LiberationMono-Regular.ttf",
                "fonts/LICENSE-Liberation.txt", "themes/*/theme.txt",
                "lang/*.tsv",   // every catalogue; the app copies out only the phone's language
                "fonts/NotoSansArabic-Regular.ttf", "fonts/NotoSansTifinagh-Regular.ttf",
                "fonts/NotoSansLao-Regular.ttf", "fonts/NotoSansCherokee-Regular.ttf", "fonts/LICENSE-Noto.txt",
                "pocket-shells/*.jpg", "pocket-shells/index.txt",   // the rendered shells (pocket-skins)
                "pocket-splash/splash_*.jpg", "pocket-splash/logo.jpg", "pocket-splash/index.txt"   // the splash art (not the candidates beside it)
    }
    into pocketAssets.map { it.dir("data") }
    // The theme list the app reads (assets cannot be listed from native code).
    doLast {
        def themes = new File("${rootDir}/../data/themes").listFiles()
                .findAll { it.isDirectory() && new File(it, "theme.txt").exists() }
                .collect { it.name }.sort()
        pocketAssets.get().file("data/themes/index.txt").asFile.text = themes.join("\n") + "\n"
    }
}
android.sourceSets.main.assets.srcDirs += pocketAssets
preBuild.dependsOn("copyPocketAssets")

// The Android FFmpeg build's shared libraries (build_ffmpeg_android.sh), packed
// beside libmain.so. Absent until that build has run; Pocket then has no video.
def pocketDeps = System.getenv("POCKET_DEPS") ?: "X:/android"
def pocketJni = layout.buildDirectory.dir("pocket-jni")
tasks.register("copyFfmpegLibs", Copy) {
    from("${pocketDeps}/prefix/arm64-v8a/lib") { include "*.so" }
    into pocketJni.map { it.dir("arm64-v8a") }
}
android.sourceSets.main.jniLibs.srcDirs += pocketJni
preBuild.dependsOn("copyFfmpegLibs")

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
