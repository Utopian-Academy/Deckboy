  - BROWSER_CEF_PLAN.md
  - CODEMAP.md
  - COMPOSITE_CUE_SPEC.md
  - DATAMOSH_PLAN.md
  - EFFECTS_PLAN.md
  - GPU_DECODE_PLAN.md
  - HAP_PLAYBACK_PLAN.md
  - ICON_DESIGN_BRIEF.md
  - PACKAGING.md
  - SDL3_MIGRATION_PLAN.md
  - ST2110_FEASIBILITY.md
  - SYPHON_PLAN.md
  - VERSION_FLOW.md
  - streamdeck
