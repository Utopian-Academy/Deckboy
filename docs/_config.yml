# The Pages site is the four pages in this folder and their images.
#
# Everything else in docs/ is internal engineering material -- plans,
# feasibility notes, the code map, packaging detail. It was already in the
# public repository, but enabling Pages turned it into a set of web pages a
# search engine would index, which was never the intention. Excluding it here
# keeps the SITE to what was meant to be published without changing what the
# repository contains.
exclude:
