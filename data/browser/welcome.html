<!doctype html>
<meta charset="utf-8">
<title>Deckboy browser cue</title>
<style>
  html, body { margin: 0; height: 100%; }
  /* Opaque, full-bleed, and a colour nothing else in the rig uses: if this is
     on the output then the whole browser chain -- helper, page load, capture,
     compositor -- is working, and if it is not then the fault is upstream of
     whatever page the operator meant to load. */
  #card {
    position: fixed; inset: 0; background: #00c853; color: #06170d;
    display: flex; flex-direction: column; gap: 2.2vh;
    align-items: center; justify-content: center;
    font: 700 7.2vh/1.05 -apple-system, "Segoe UI", "Liberation Sans", system-ui, sans-serif;
    letter-spacing: .01em; text-align: center;
  }
  #sub { font-size: 2.6vh; font-weight: 600; opacity: .68; letter-spacing: .14em; }
</style>
<div id="card">
  <div>DECKBOY BROWSER CUE</div>
  <div id="sub">SET A URL IN THE CUE INSPECTOR</div>
</div>
